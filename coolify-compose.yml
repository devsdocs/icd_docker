version: '3.8'

services:
  # 1. Nginx API Gateway (Handles the ?token= guard)
  api-gateway:
    image: nginx:alpine
    environment:
      - API_TOKEN=${API_TOKEN:-mysecret}
      - ICD11_DOMAIN=${ICD11_DOMAIN:-icd11.example.com}
      - ICD10_DOMAIN=${ICD10_DOMAIN:-icd10.example.com}
    # This command writes the configuration dynamically so no external files are needed!
    command: >
      /bin/sh -c '
      echo "
      server {
          listen 80 default_server;
          location /health {
              return 200 \"healthy\n\";
          }
          location / {
              return 403 \"Forbidden: Unknown Domain\n\";
          }
      }
      server {
          listen 80;
          server_name $${ICD11_DOMAIN};
          location / {
              if (\$$arg_token != \"$${API_TOKEN}\") {
                  return 403 \"Forbidden: Invalid or missing ?token= parameter\n\";
              }
              proxy_pass http://icd11-api:80;
          }
      }
      server {
          listen 80;
          server_name $${ICD10_DOMAIN};
          location / {
              if (\$$arg_token != \"$${API_TOKEN}\") {
                  return 403 \"Forbidden: Invalid or missing ?token= parameter\n\";
              }
              proxy_pass http://icd10-api:3000;
          }
      }
      " > /etc/nginx/conf.d/default.conf &&
      nginx -g "daemon off;"'
    restart: always
    depends_on:
      - icd11-api
      - icd10-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # 2. Official WHO ICD-11 API
  icd11-api:
    image: whoicd/icd-api:latest
    environment:
      - acceptLicense=true
      - saveAnalytics=true
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -f http://localhost/ct11 > /dev/null || wget -qO- http://localhost/ct11 > /dev/null || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 300s

  # 3. Community ICD-10 API
  icd10-api:
    image: ghcr.io/dot-base/icd-10-api:6.0.0
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -f http://localhost:3000/api/icd10?search=cholera > /dev/null || wget -qO- http://localhost:3000/api/icd10?search=cholera > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
