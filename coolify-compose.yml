version: '3.8'

services:
  # 1. Nginx API Gateway (Handles the ?token= guard)
  api-gateway:
    image: nginx:alpine
    environment:
      - API_TOKEN=${API_TOKEN:-mysecret}
      - ICD11_DOMAIN=${ICD11_DOMAIN:-icd11.example.com}
      - ICD10_DOMAIN=${ICD10_DOMAIN:-icd10.example.com}
    # This command writes the configuration dynamically so no external files are needed!
    command: >
      /bin/sh -c "echo '
      server {
          listen 80 default_server;
          location /health {
              return 200 \"healthy\";
          }
          location / {
              return 403 \"Forbidden\";
          }
      }
      server {
          listen 80;
          server_name ${ICD11_DOMAIN};
          location / {
              set $$auth 0;
              if ($$cookie_icd_token = \"${API_TOKEN}\") {
                  set $$auth 1;
              }
              if ($$arg_token = \"${API_TOKEN}\") {
                  set $$auth 1;
              }
              if ($$auth = 0) {
                  return 403 \"Forbidden\";
              }
              
              add_header Set-Cookie \"icd_token=${API_TOKEN}; Path=/; Max-Age=31536000; SameSite=Lax\" always;
              proxy_pass http://icd11-api:80;
          }
      }
      server {
          listen 80;
          server_name ${ICD10_DOMAIN};
          location / {
              set $$auth 0;
              if ($$cookie_icd_token = \"${API_TOKEN}\") {
                  set $$auth 1;
              }
              if ($$arg_token = \"${API_TOKEN}\") {
                  set $$auth 1;
              }
              if ($$auth = 0) {
                  return 403 \"Forbidden\";
              }
              
              add_header Set-Cookie \"icd_token=${API_TOKEN}; Path=/; Max-Age=31536000; SameSite=Lax\" always;
              proxy_pass http://icd10-api:3000;
          }
      }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    restart: always
    depends_on:
      - icd11-api
      - icd10-api

  # 2. Official WHO ICD-11 API
  icd11-api:
    image: whoicd/icd-api:latest
    environment:
      - acceptLicense=true
      - saveAnalytics=true
    restart: always

  # 3. Community ICD-10 API
  icd10-api:
    image: ghcr.io/dot-base/icd-10-api:6.0.0
    restart: always
