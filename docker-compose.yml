version: '3.8'

services:
  # Official WHO ICD-11 API
  icd11-api:
    image: whoicd/icd-api:latest
    environment:
      - acceptLicense=true
      - saveAnalytics=true
    ports:
      - "8081:80"
    restart: unless-stopped
    # The ICD-11 container may use significant memory depending on queries.

  # Community ICD-10 API (WHO does not provide an official offline ICD-10 Docker image)
  icd10-api:
    image: ghcr.io/dot-base/icd-10-api:latest
    ports:
      - "8082:8080"
    restart: unless-stopped

  # Nginx Reverse Proxy to serve both behind a single entrypoint
  reverse-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - icd11-api
      - icd10-api
    restart: unless-stopped
