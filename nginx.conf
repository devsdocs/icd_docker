events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # Route for ICD-11 API (Official WHO container)
        location /icd11/ {
            proxy_pass http://icd11-api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route for ICD-10 API (Community container)
        location /icd10/ {
            proxy_pass http://icd10-api:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default redirect or landing
        location / {
            return 200 "ICD APIs are running.\n\nICD-11: http://localhost/icd11/ (Try http://localhost/icd11/ct11 for the coding tool)\nICD-10: http://localhost/icd10/\n";
            add_header Content-Type text/plain;
        }
    }
}
